<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Google Basit Klon</title>
</head>
<body style="text-align: center; font-family: Arial, sans-serif; margin-top: 80px;">

    <div style="margin-bottom: 30px;">
        <a href="https://images.google.com" style="color: #1a0dab; text-decoration: none; font-size: 14px;">Google Görseller</a>
    </div>

    <div style="margin-bottom: 25px;">
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" style="width: 272px;">
    </div>

    <form action="https://google.com/search" method="GET">
        
        <div>
            <input type="text" name="q" placeholder="Google'da arama yapın veya bir URL yazın" required
                   style="width: 450px; height: 20px; padding: 12px 20px; font-size: 16px; border: 1px solid #dfe1e5; border-radius: 24px;">
        </div>
        
        <div style="margin-top: 25px;">
            
            <input type="submit" value="Google'da Ara" 
                   style="background-color: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043; padding: 10px 16px; font-size: 14px; margin: 5px; cursor: pointer;">
            
            <button type="submit" name="btnI" value="1" 
                    style="background-color: #f8f9fa; border: 1px solid #f8f9fa; border-radius: 4px; color: #3c4043; padding: 10px 16px; font-size: 14px; margin: 5px; cursor: pointer;">
                Kendimi Şanslı Hissediyorum
            </button>
            
        </div>

    </form>

</body>
</html>
